plugins {
    id 'com.android.application'
}

// Larger source videos are stored in numbered parts for reliable repository transfer.
// A clean checkout reconstructs their exact bytes before assets are packaged.
def generatedWallpaperAssets = layout.buildDirectory.dir('generated/wallpaperAssets')
android.sourceSets.main.assets.srcDir(generatedWallpaperAssets)
def assembleVideoWallpapers = tasks.register('assembleVideoWallpapers') {
    inputs.files(fileTree('video-parts')).withPropertyName('videoParts')
    inputs.file('src/main/assets/video-wallpapers/manifest.json')
    outputs.dir(generatedWallpaperAssets)
    outputs.upToDateWhen { false }
    doLast {
        def clips = new groovy.json.JsonSlurper().parse(file('src/main/assets/video-wallpapers/manifest.json')).clips
        def groups = fileTree('video-parts').files.sort { it.name }.groupBy { it.name.replaceFirst(/\.part\d+$/, '') }
        groups.each { name, parts ->
            def target = new File(generatedWallpaperAssets.get().asFile, "video-wallpapers/${name}")
            if (file("src/main/assets/video-wallpapers/${name}").exists()) {
                target.delete()
            } else {
                target.parentFile.mkdirs()
                target.withOutputStream { output -> parts.each { part -> part.withInputStream { input -> output << input } } }
                def digest = java.security.MessageDigest.getInstance('SHA-256')
                target.withInputStream { input ->
                    byte[] buffer = new byte[65536]
                    int count
                    while ((count = input.read(buffer)) > 0) digest.update(buffer, 0, count)
                }
                def expected = clips.find { it.file == name }
                if (expected == null || target.length() != expected.bytes || digest.digest().encodeHex().toString() != expected.sha256) {
                    throw new GradleException("Video parts failed integrity check: ${name}")
                }
            }
        }
    }
}
tasks.configureEach { if (it.name == 'preBuild') it.dependsOn(assembleVideoWallpapers) }

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        // Opt-in identity for firmware with a package-name HOME allowlist; see docs/devices/xiaomi-mitv-aetp0-dofus.md.
        applicationId providers.gradleProperty('launcherApplicationId').getOrElse('com.bytv.launcher')
        minSdk 26
        targetSdk 34
        versionCode 52
        versionName '5.21'
    }

    // Play the five 4K clips directly from APK offsets without copying them to external storage.
    androidResources {
        noCompress += ['mp4']
    }

    buildTypes {
        release {
            // R8 strips and optimises the code (AndroidX included): smaller APK, faster start on a slow TV CPU.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sideloaded over ADB, never published: sign with the debug key so it installs over a debug build.
            signingConfig signingConfigs.debug
        }
    }

    packagingOptions {
        resources {
            // Kotlin metadata pulled in by AndroidX's dependencies. This launcher is plain Java and never reads it;
            // leaving it out saves about 14 KB of every install.
            excludes += ['kotlin/**', 'META-INF/*.version', 'META-INF/*.kotlin_module', 'DebugProbesKt.bin']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation files('libs/zxing-core-3.5.3.jar')
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    // Test only (never in the APK): plain JVM tests for the module card validators, src/test.
    testImplementation 'junit:junit:4.13.2'
}
