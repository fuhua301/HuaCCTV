<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电视壁纸管理</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top left,#334a79,transparent 65%),#101522;color:#f5f7fc;min-height:100vh}main{max-width:1000px;margin:auto;padding:28px 18px}h1{font-size:28px;margin:0 0 8px}p{color:#bcc7dc;line-height:1.6;margin:5px 0 18px}.glass{background:#ffffff12;border:1px solid #ffffff22;border-radius:22px;padding:18px;margin:18px 0;backdrop-filter:blur(24px)}button,.upload,select{font:inherit;border:1px solid #ffffff2b;background:#ffffff17;color:inherit;padding:11px 16px;border-radius:12px;cursor:pointer;display:inline-block}button:hover,.upload:hover{background:#ffffff30}button:disabled,select:disabled{opacity:.45;cursor:wait}.upload{background:#c9daff;color:#15213b;font-weight:600}input[type=file]{display:none}.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}.card{border:1px solid #ffffff22;background:#ffffff0d;border-radius:18px;overflow:hidden}.card.active{border:2px solid #a9c8ff}.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#202a3b;display:block}.caption{padding:12px}.name{font-size:14px;overflow-wrap:anywhere;margin-bottom:7px}.size{color:#aab8d1;font-size:12px;margin-bottom:12px}.danger{color:#ffbdbd}.card button{padding:8px 11px;font-size:13px}#status{position:sticky;top:10px;background:#1c2a43ee;z-index:2;padding:13px;border-radius:12px;margin:12px 0;display:none}select{background:#26324a}progress{width:100%;height:6px;accent-color:#c9daff}#empty{display:none;padding:30px;text-align:center;color:#b7c5de}small{color:#b7c5de}button:focus-visible,.upload:focus-visible,select:focus-visible{outline:3px solid #9fc1ff;outline-offset:3px}
</style><main><h1>电视壁纸</h1><p>添加喜欢的风景，让电视换个样子。请保持电视上的设置页面开启，完成后返回桌面查看效果。</p>
<div id="status" role="status" aria-live="polite"></div><section class="glass"><div class="tools"><label class="upload" tabindex="0" role="button" for="files">＋ 添加壁纸</label><input id="files" type="file" accept="image/jpeg,image/png,image/webp" multiple><button id="refresh">刷新</button><span id="summary"></span></div><p style="margin:12px 0 0;font-size:13px">支持 JPG、PNG、WebP，单张不超过 10 MB，最多 100 张。推荐横向图片。</p><progress id="progress" hidden></progress></section>
<section class="glass"><div class="tools"><button id="rotate">使用全部壁纸轮换</button><label>轮换间隔 <select id="minutes"><option value="0">跟随主题</option></select></label><button id="none">不显示壁纸</button></div><p id="mode" style="margin:12px 0 0;font-size:13px"></p></section><div id="empty">还没有壁纸，点击“添加壁纸”上传第一张。</div><section id="grid" class="grid"></section></main>
<script>
const $=id=>document.getElementById(id);let busy=false;
const root=location.pathname.endsWith('/')?location.pathname:location.pathname+'/';
function message(text){$('status').textContent=text;$('status').style.display='block'}
async function api(route,method='GET',body){const response=await fetch(root+route,{method,body});if(!response.ok)throw Error(await response.text());return response}
function lock(on){busy=on;document.querySelectorAll('button,select,input').forEach(el=>el.disabled=on)}
async function update(){const data=await(await api('list')).json();$('summary').textContent=data.images.length+' 张 · 可用 '+(data.free/1073741824).toFixed(1)+' GB';$('minutes').value=data.minutes;$('mode').textContent=data.selected==='none'?'当前：不显示壁纸':data.selected?'当前：固定使用所选壁纸':'当前：全部壁纸自动轮换';$('grid').replaceChildren();$('empty').style.display=data.images.length?'none':'block';for(const item of data.images){let card=document.createElement('article');card.className='card'+(item.name===data.selected?' active':'');let img=document.createElement('img');img.loading='lazy';img.alt=item.name;img.src=root+'thumb?name='+encodeURIComponent(item.name);card.append(img);let caption=document.createElement('div');caption.className='caption';let title=document.createElement('div');title.className='name';title.textContent=item.name;caption.append(title);let size=document.createElement('div');size.className='size';size.textContent=(item.bytes/1048576).toFixed(2)+' MB'+(item.name===data.selected?' · 正在使用':'');caption.append(size);let tools=document.createElement('div');tools.className='tools';let use=document.createElement('button');use.textContent=item.name===data.selected?'已选中':'设为壁纸';use.onclick=()=>action('select?name='+encodeURIComponent(item.name),'壁纸已选中，电视返回桌面后生效');let del=document.createElement('button');del.className='danger';del.textContent='删除';del.onclick=()=>{if(confirm('删除这张壁纸？将从电视中删除文件并释放空间。'))action('delete?name='+encodeURIComponent(item.name),'壁纸已删除')};tools.append(use,del);caption.append(tools);card.append(caption);$('grid').append(card)}}
async function action(route,text){if(busy)return;lock(true);try{await api(route,'POST');await update();message(text)}catch(e){message(e.message+'；如果连接已关闭，请在电视重新打开二维码并扫码。')}finally{lock(false)}}
$('refresh').onclick=()=>{if(!busy)update().catch(e=>message(e.message))};$('rotate').onclick=()=>action('select?name=','已开启全部壁纸轮换');$('none').onclick=()=>action('select?name=none','已关闭壁纸显示');for(let i=1;i<=10;i++){$('minutes').add(new Option(i+' 分钟',i))}$('minutes').onchange=()=>action('rotation?minutes='+$('minutes').value,'轮换间隔已保存');
$('files').onchange=async()=>{if(busy)return;const files=[...$('files').files];if(!files.length)return;lock(true);$('progress').hidden=false;$('progress').max=files.length;let success=0,fail=[];for(let i=0;i<files.length;i++){message('正在上传 '+(i+1)+' / '+files.length+'：'+files[i].name);try{if(files[i].size>10485760)throw Error('超过 10 MB');await api('upload?name='+encodeURIComponent(files[i].name),'POST',files[i]);success++}catch(e){fail.push(files[i].name+'：'+e.message)}$('progress').value=i+1}try{await update()}catch(e){fail.push('请保持电视设置页面开启，或重新扫码连接')}finally{lock(false);$('files').value='';$('progress').hidden=true;message('已添加 '+success+' 张'+(fail.length?'；'+fail.join('；'):''))}};
document.querySelector('.upload').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&!busy){e.preventDefault();$('files').click()}};update().catch(()=>message('连接已关闭，请在电视重新打开二维码并扫码。'));
</script></html>
