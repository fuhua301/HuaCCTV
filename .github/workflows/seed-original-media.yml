name: Prepare original HDR media
on:
  push:
    branches: [main]
    paths: ['.github/seed-original-ocean.json']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify original source
        run: |
          url=$(jq -r .url .github/seed-original-ocean.json)
          curl --fail --location --retry 3 "$url" --output original.mp4
          printf '%s  original.mp4\n' "$(jq -r .md5 .github/seed-original-ocean.json)" | md5sum --check
      - name: Store exact source blobs for release assembly
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json, hashlib, base64, subprocess, os
          m=json.load(open('.github/seed-original-ocean.json'))
          with open('original.mp4','rb') as f:
            for i,p in enumerate(m['parts']):
              b=f.read(p['bytes'])
              sha=hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
              assert sha==p['sha']
              if p['skip']:
                print('Already stored',i,sha,flush=True)
                continue
              with open('blob.json','w') as out:json.dump(dict(content=base64.b64encode(b).decode(),encoding='base64'),out)
              data=json.loads(subprocess.check_output(['gh','api','--method','POST','repos/'+os.environ['GITHUB_REPOSITORY']+'/git/blobs','--input','blob.json']))
              assert data['sha']==sha
              print('Stored',i,sha,flush=True)
          os.remove('blob.json')
