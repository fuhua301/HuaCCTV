name: Publish verified APK
on:
  push:
    branches: [main]
    paths: ['.github/release-manifest.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-verified-apk
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify locally signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=.github/release-manifest.json
          apk=$(jq -r .filename "$manifest")
          mkdir -p release-output
          : > "release-output/$apk"
          while read -r blob; do
            gh api "repos/$GITHUB_REPOSITORY/git/blobs/$blob" --jq .content | base64 --decode >> "release-output/$apk"
          done < <(jq -r '.parts[].sha' "$manifest")
          expected=$(jq -r .sha256 "$manifest")
          printf '%s  %s\n' "$expected" "release-output/$apk" | sha256sum --check
          test "$(stat -c%s "release-output/$apk")" = "$(jq -r .bytes "$manifest")"
          printf '%s  %s\n' "$expected" "$apk" > release-output/SHA256SUMS.txt
      - name: Publish download
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest=.github/release-manifest.json
          tag=$(jq -r .tag "$manifest")
          apk=$(jq -r .filename "$manifest")
          jq -r .notes "$manifest" > release-output/notes.md
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$(jq -r .title "$manifest")" --notes-file release-output/notes.md
          fi
          gh release upload "$tag" "release-output/$apk" release-output/SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
